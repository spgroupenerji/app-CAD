[package]
name = "spcad-ui-egui"
description = "SPCAD user interface (egui): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
spcad-geom = { workspace = true }
spcad-color = { workspace = true }
spcad-doc = { workspace = true }
spcad-render = { workspace = true }
spcad-engine = { workspace = true }
spcad-fonts = { workspace = true }
egui = { workspace = true }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
# Genel arayüz ikonları: Lucide seti (P1).
iconflow = { version = "2.1", features = ["pack-lucide"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
